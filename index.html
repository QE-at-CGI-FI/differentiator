<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differentiator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cgi-red: #cc0000;
      --cgi-red-dark: #a80000;
      --bg: #f0f0f0;
      --surface: #ffffff;
      --surface-2: #f7f7f7;
      --border: #d4d4d4;
      --border-light: #e8e8e8;
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-muted: #999999;
      --text-placeholder: #bbbbbb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #111111;
      border-bottom: 3px solid var(--cgi-red);
      padding: 0 32px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      height: 32px;
      display: block;
    }

    .header-label {
      font-size: 13px;
      font-weight: 500;
      color: #888888;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-add-element {
      background: var(--cgi-red);
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
    }
    .btn-add-element:hover { background: var(--cgi-red-dark); }

    /* ── Layout ── */
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    /* ── Element Card ── */
    .element-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 12px;
    }

    .element-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      border-left: 3px solid var(--cgi-red);
      flex: 1;
      min-width: 0;
    }

    .element-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
    }

    .element-title-input {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      border: none;
      outline: none;
      background: transparent;
      min-width: 0;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
    }
    .element-title-input::placeholder { color: var(--text-placeholder); font-weight: 400; }
    .element-title-input:focus { background: var(--surface-2); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge-count {
      font-size: 11px;
      color: var(--text-muted);
      background: #ebebeb;
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .badge-strongest {
      font-size: 11px;
      color: var(--cgi-red);
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      padding: 2px 8px;
      border-radius: 3px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #cccccc;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
    }
    .btn-icon:hover { color: var(--text-secondary); background: #ebebeb; }
    .btn-icon.danger:hover { color: var(--cgi-red); background: #fff0f0; }
    .btn-icon.collapse { font-size: 11px; }

    /* ── One-liner ── */
    .element-oneliner {
      padding: 0 20px 12px;
    }

    .element-oneliner-input {
      width: 100%;
      font-size: 13px;
      color: var(--text-secondary);
      border: none;
      outline: none;
      background: transparent;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
    }
    .element-oneliner-input::placeholder { color: var(--text-placeholder); }
    .element-oneliner-input:focus { background: var(--surface-2); }

    /* ── Options ── */
    .element-divider { height: 1px; background: var(--border-light); }

    .options-section { padding: 12px 14px; background: var(--surface-2); }

    .options-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .option-row {
      border: 1px solid var(--border-light);
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--surface);
      transition: border-color 0.15s, background 0.15s;
    }
    .option-row.is-strongest {
      border-color: var(--cgi-red);
      border-left: 3px solid var(--cgi-red);
      background: #fff8f8;
    }

    .option-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .option-title-input {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      border: none;
      outline: none;
      background: transparent;
      min-width: 0;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: inherit;
    }
    .option-title-input::placeholder { color: var(--text-placeholder); font-weight: 400; }
    .option-title-input:focus { background: var(--surface-2); }

    .btn-strongest {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 9px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: inherit;
    }
    .btn-strongest:hover { border-color: var(--cgi-red); color: var(--cgi-red); }
    .btn-strongest.active { border-color: var(--cgi-red); background: var(--cgi-red); color: white; }

    .option-description-input {
      width: 100%;
      font-size: 12px;
      color: var(--text-secondary);
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
      display: block;
      overflow: hidden;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .option-description-input::placeholder { color: var(--text-placeholder); }
    .option-description-input:focus { background: var(--surface-2); }

    .btn-add-option {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--cgi-red);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 4px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .btn-add-option:hover { opacity: 0.7; }

    /* ── Collapsed ── */
    .element-row.collapsed .element-divider,
    .element-row.collapsed .options-section { display: none; }

    /* ── Questions Panel ── */
    .questions-panel {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      border-left: 3px solid #c8a000;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 10px;
    }

    .questions-panel-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .question-item {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      margin-bottom: 2px;
    }

    .question-input {
      flex: 1;
      font-size: 12px;
      color: var(--text-primary);
      border: none;
      outline: none;
      background: transparent;
      padding: 3px 5px;
      border-radius: 3px;
      font-family: inherit;
      min-width: 0;
      resize: none;
      overflow: hidden;
      display: block;
      line-height: 1.4;
    }
    .question-input::placeholder { color: var(--text-placeholder); font-style: italic; }
    .question-input:focus { background: var(--surface-2); }

    .questions-spacer { flex: 1; }

    .btn-add-question {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 2px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: inherit;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .btn-add-question:hover { color: var(--text-secondary); }

    /* ── Vision ── */
    .vision-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      border-left: 3px solid var(--cgi-red);
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    .vision-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .vision-input {
      width: 100%;
      font-size: 14px;
      color: var(--text-primary);
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      font-family: inherit;
      line-height: 1.6;
      display: block;
      overflow: hidden;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .vision-input::placeholder { color: var(--text-placeholder); }
    .vision-input:focus { background: var(--surface-2); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 0;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 36px; margin-bottom: 16px; color: var(--cgi-red); }
    .empty-state h2 { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; }

    /* ── Header actions ── */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary {
      background: transparent;
      color: #aaaaaa;
      border: 1px solid #444444;
      padding: 6px 13px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { color: white; border-color: #aaaaaa; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #222222;
      color: white;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 4px;
      border-left: 3px solid var(--cgi-red);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 200;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Drag and Drop ── */
    .drag-handle {
      cursor: grab;
      color: #cccccc;
      padding: 2px 5px;
      font-size: 15px;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
      border-radius: 3px;
    }
    .drag-handle:hover { color: var(--text-secondary); background: #ebebeb; }
    .drag-handle:active { cursor: grabbing; }
    .element-card.dragging { opacity: 0.35; }
    .option-row.dragging { opacity: 0.35; }
    .element-row.drag-over-top { box-shadow: 0 -3px 0 0 var(--cgi-red); }
    .element-row.drag-over-bottom { box-shadow: 0 3px 0 0 var(--cgi-red); }
    .option-row.drag-over-top { box-shadow: 0 -2px 0 0 var(--cgi-red); }
    .option-row.drag-over-bottom { box-shadow: 0 2px 0 0 var(--cgi-red); }

    /* ── Tabs ── */
    .tab-bar {
      background: #111111;
      border-bottom: 1px solid #2a2a2a;
      padding: 0 32px;
      display: flex;
      align-items: flex-end;
      position: sticky;
      top: 58px;
      z-index: 99;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #888888;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: #cccccc; }
    .tab-btn.active { color: white; border-bottom-color: var(--cgi-red); }

    /* ── Roadmap section label ── */
    .roadmap-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    /* ── Priority Matrix ── */
    .matrix-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px 20px 14px;
      margin-bottom: 28px;
    }
    .matrix-svg { width: 100%; height: auto; display: block; }
    .matrix-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
      font-size: 11px;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.now { background: #2d8a4e; }
    .legend-dot.next { background: #1a5bbf; }
    .legend-dot.later { background: #b85000; }
    .legend-dot.unassigned { background: #aaaaaa; }

    /* ── Swimlane ── */
    .swimlane {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      align-items: start;
    }
    .swimlane-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .swimlane-header {
      padding: 9px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-light);
    }
    .swimlane-header.now     { color: #2d8a4e; background: #f0faf3; border-left: 3px solid #2d8a4e; }
    .swimlane-header.next    { color: #1a5bbf; background: #f0f4ff; border-left: 3px solid #1a5bbf; }
    .swimlane-header.later   { color: #b85000; background: #fff8f0; border-left: 3px solid #b85000; }
    .swimlane-header.unassigned { color: var(--text-muted); background: var(--surface-2); border-left: 3px solid var(--border); }
    .swimlane-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
    .swimlane-empty { font-size: 12px; color: var(--text-placeholder); text-align: center; padding: 16px 8px; font-style: italic; }

    /* ── Roadmap Card ── */
    .roadmap-card {
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      padding: 10px 12px;
    }
    .roadmap-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 9px;
      line-height: 1.3;
    }
    .roadmap-meta-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .roadmap-meta-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      width: 40px;
      flex-shrink: 0;
    }
    .seg-btn {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 2px 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.1s;
      line-height: 1.5;
    }
    .seg-btn:hover { border-color: var(--cgi-red); color: var(--cgi-red); }
    .seg-btn.active-scope   { background: #444;           color: white; border-color: #444;           }
    .seg-btn.active-effort  { background: var(--cgi-red); color: white; border-color: var(--cgi-red); }
    .seg-btn.active-value   { background: #1a5bbf;        color: white; border-color: #1a5bbf;        }
    .seg-btn.active-now     { background: #2d8a4e;        color: white; border-color: #2d8a4e;        }
    .seg-btn.active-next    { background: #1a5bbf;        color: white; border-color: #1a5bbf;        }
    .seg-btn.active-later   { background: #b85000;        color: white; border-color: #b85000;        }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="image.png" alt="CGI" class="header-logo" />
      <span class="header-label">Differentiator</span>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" onclick="importData()" title="Import from JSON file">↑ Import</button>
      <button class="btn-secondary" onclick="exportData()" title="Export to JSON file">↓ Export</button>
      <button class="btn-add-element" onclick="addElement()">+ Add Element</button>
    </div>
  </header>
  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-elements" onclick="switchTab('elements')">Elements</button>
    <button class="tab-btn" id="tab-roadmap" onclick="switchTab('roadmap')">Roadmap</button>
  </nav>
  <main>
    <div id="app"></div>
    <div id="roadmap-panel" style="display:none"></div>
  </main>
  <div id="toast"></div>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImportFile(event)" />

  <script>
    const SAMPLE_DATA = {
      isSample: true,
      vision: 'CGI becomes the partner of choice by delivering differentiated, client-centric solutions that combine deep domain expertise with cutting-edge technology.',
      elements: [
        {
          id: 'sample-1',
          title: 'Cloud Migration Approach',
          oneliner: 'How we move the client\'s workloads to the cloud',
          collapsed: false,
          questions: [],
          options: [
            {
              id: 'sample-1-a',
              title: 'Lift & Shift',
              description: 'Rehost existing workloads with minimal changes. Fastest time-to-cloud, lower upfront cost, limited optimization.',
              isStrongest: false
            },
            {
              id: 'sample-1-b',
              title: 'Re-platform',
              description: 'Migrate with targeted optimizations (e.g. managed DB, containerization). Balances speed and cloud-native benefits.',
              isStrongest: true
            },
            {
              id: 'sample-1-c',
              title: 'Re-architect',
              description: 'Redesign as cloud-native microservices. Highest long-term value; requires more investment and time.',
              isStrongest: false
            }
          ]
        },
        {
          id: 'sample-2',
          title: 'Support & Operations Model',
          oneliner: 'Post-go-live support coverage and escalation paths',
          collapsed: false,
          questions: [],
          options: [
            {
              id: 'sample-2-a',
              title: 'Business Hours (L1–L2)',
              description: 'Support during business hours with SLA response times. Suitable for non-critical systems.',
              isStrongest: false
            },
            {
              id: 'sample-2-b',
              title: '24/7 Managed Service',
              description: 'Round-the-clock monitoring and incident response. Dedicated on-call rotation with defined escalation paths.',
              isStrongest: true
            }
          ]
        },
        {
          id: 'sample-3',
          title: 'Security & Compliance Scope',
          oneliner: 'Level of security hardening and regulatory coverage included',
          collapsed: false,
          questions: [],
          options: [
            {
              id: 'sample-3-a',
              title: 'Baseline Hardening',
              description: 'CIS benchmark application, vulnerability scanning, and access management basics.',
              isStrongest: false
            },
            {
              id: 'sample-3-b',
              title: 'Full Compliance Package',
              description: 'Includes ISO 27001 / SOC 2 readiness, SIEM integration, and quarterly audit support.',
              isStrongest: false
            }
          ]
        }
      ]
    };

    let state = { elements: [] };

    function loadState() {
      try {
        const raw = localStorage.getItem('differentiator-v1');
        if (raw) {
          state = JSON.parse(raw);
        } else {
          state = SAMPLE_DATA;
        }
      } catch (e) {
        state = { elements: [] };
      }
    }

    function saveState() {
      localStorage.setItem('differentiator-v1', JSON.stringify(state));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function escHtml(s) {
      return (s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escAttr(s) {
      return (s || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ── Import / Export ──

    function exportData() {
      const filename = 'differentiator-' + new Date().toISOString().slice(0, 10) + '.json';
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported ' + filename);
    }

    function importData() {
      document.getElementById('import-input').value = '';
      document.getElementById('import-input').click();
    }

    function handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.elements)) throw new Error('Invalid format');
          state = parsed;
          saveState();
          render();
          showToast('Imported ' + file.name + ' — ' + state.elements.length + ' element(s)');
        } catch (err) {
          showToast('Import failed: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ── Structural actions (trigger re-render) ──

    function addElement() {
      if (state.isSample) {
        state = { elements: [] };
      }
      state.elements.push({ id: uid(), title: '', oneliner: '', questions: [], options: [], collapsed: false });
      saveState();
      render();
      const inputs = document.querySelectorAll('.element-title-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function deleteElement(id) {
      state.elements = state.elements.filter(e => e.id !== id);
      saveState();
      render();
    }

    function toggleCollapse(id) {
      const el = state.elements.find(e => e.id === id);
      if (el) el.collapsed = !el.collapsed;
      saveState();
      render();
    }

    function addOption(elementId) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      el.options.push({ id: uid(), title: '', description: '', isStrongest: false });
      saveState();
      render();
      const card = document.querySelector(`[data-card="${elementId}"]`);
      if (card) {
        const inputs = card.querySelectorAll('.option-title-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      }
    }

    function deleteOption(elementId, optionId) {
      const el = state.elements.find(e => e.id === elementId);
      if (el) el.options = el.options.filter(o => o.id !== optionId);
      saveState();
      render();
    }

    function toggleStrongest(elementId, optionId) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      const opt = el.options.find(o => o.id === optionId);
      if (!opt) return;
      const wasStrongest = opt.isStrongest;
      el.options.forEach(o => (o.isStrongest = false));
      if (!wasStrongest) opt.isStrongest = true;
      saveState();
      render();
    }

    function addQuestion(elementId) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      if (!el.questions) el.questions = [];
      el.questions.push('');
      saveState();
      render();
      const row = document.querySelector(`[data-row="${elementId}"]`);
      if (row) {
        const inputs = row.querySelectorAll('.question-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      }
    }

    function deleteQuestion(elementId, idx) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el || !el.questions) return;
      el.questions.splice(idx, 1);
      saveState();
      render();
    }

    // ── Input handler (no re-render, just persist) ──

    function bindVisionInput() {
      const vta = document.querySelector('.vision-input');
      if (!vta) return;
      vta.addEventListener('input', () => {
        state.vision = vta.value;
        saveState();
        autoResize(vta);
      });
      autoResize(vta);
    }

    function handleInput(e) {
      const t = e.target;
      const elementId = t.dataset.elementId;
      const optionId = t.dataset.optionId;
      const field = t.dataset.field;
      if (!elementId || !field) return;
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      if (field === 'question') {
        const idx = parseInt(t.dataset.questionIdx, 10);
        if (!isNaN(idx)) {
          if (!el.questions) el.questions = [];
          el.questions[idx] = t.value;
          saveState();
        }
        return;
      }
      if (optionId) {
        const opt = el.options.find(o => o.id === optionId);
        if (opt) opt[field] = t.value;
      } else {
        el[field] = t.value;
      }
      saveState();
    }

    function autoResize(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    // ── Render ──

    function render() {
      const app = document.getElementById('app');

      // Vision section (always rendered)
      let visionHtml = `
        <div class="vision-section">
          <div class="vision-label">Vision</div>
          <textarea
            class="vision-input"
            placeholder="Describe the overall vision for this proposal…"
            rows="2"
            data-field="vision"
          >${escHtml(state.vision || '')}</textarea>
        </div>`;

      if (!state.elements.length) {
        app.innerHTML = visionHtml + `
          <div class="empty-state">
            <div class="empty-icon">◈</div>
            <h2>No offering elements yet</h2>
            <p>Add an element to start building your differentiator</p>
          </div>`;
        bindVisionInput();
        return;
      }

      app.innerHTML = visionHtml + state.elements.map(el => {
        const strongest = el.options.find(o => o.isStrongest);
        const optCount = el.options.length;
        return `
        <div class="element-row${el.collapsed ? ' collapsed' : ''}" data-row="${el.id}">
        <div class="element-card" data-card="${el.id}">
          <div class="element-header">
            <span class="element-drag-handle drag-handle" draggable="true" title="Drag to reorder">⠿</span>
            <input
              type="text"
              class="element-title-input"
              placeholder="Element title"
              value="${escAttr(el.title)}"
              data-element-id="${el.id}"
              data-field="title"
            />
            <div class="header-meta">
              ${strongest
                ? `<span class="badge-strongest" title="Proposed: ${escAttr(strongest.title)}">★ ${escHtml(strongest.title || 'Strongest')}</span>`
                : ''}
              <span class="badge-count">${optCount} option${optCount !== 1 ? 's' : ''}</span>
            </div>
            <button class="btn-icon collapse" onclick="toggleCollapse('${el.id}')" title="${el.collapsed ? 'Expand' : 'Collapse'}">${el.collapsed ? '▸' : '▾'}</button>
            <button class="btn-icon danger" onclick="deleteElement('${el.id}')" title="Delete element">✕</button>
          </div>

          <div class="element-oneliner">
            <input
              type="text"
              class="element-oneliner-input"
              placeholder="One-liner — what is this element about?"
              value="${escAttr(el.oneliner)}"
              data-element-id="${el.id}"
              data-field="oneliner"
            />
          </div>

          <div class="element-divider"></div>

          <div class="options-section">
            <div class="options-label">Options</div>
            ${el.options.map(opt => `
              <div class="option-row${opt.isStrongest ? ' is-strongest' : ''}" data-element-id="${el.id}" data-option-id="${opt.id}">
                <div class="option-row-top">
                  <span class="option-drag-handle drag-handle" draggable="true" title="Drag to reorder">⠿</span>
                  <input
                    type="text"
                    class="option-title-input"
                    placeholder="Option title"
                    value="${escAttr(opt.title)}"
                    data-element-id="${el.id}"
                    data-option-id="${opt.id}"
                    data-field="title"
                  />
                  <button
                    class="btn-strongest${opt.isStrongest ? ' active' : ''}"
                    onclick="toggleStrongest('${el.id}', '${opt.id}')"
                    title="${opt.isStrongest ? 'Remove strongest mark' : 'Mark as strongest proposal'}"
                  >${opt.isStrongest ? '★ Strongest' : '☆ Strongest'}</button>
                  <button class="btn-icon danger" onclick="deleteOption('${el.id}', '${opt.id}')" title="Delete option">✕</button>
                </div>
                <textarea
                  class="option-description-input"
                  placeholder="Describe this option…"
                  rows="1"
                  data-element-id="${el.id}"
                  data-option-id="${opt.id}"
                  data-field="description"
                >${escHtml(opt.description)}</textarea>
              </div>
            `).join('')}
            <button class="btn-add-option" onclick="addOption('${el.id}')">+ Add option</button>
          </div>
        </div>
        <div class="questions-panel">
          <div class="questions-panel-label">Questions</div>
          ${(el.questions || []).map((q, i) => `
            <div class="question-item">
              <textarea class="question-input"
                placeholder="Driving question…"
                rows="1"
                data-element-id="${el.id}"
                data-field="question"
                data-question-idx="${i}"
              >${escHtml(q)}</textarea>
              <button class="btn-icon danger" onclick="deleteQuestion('${el.id}', ${i})" title="Remove">✕</button>
            </div>
          `).join('')}
          <div class="questions-spacer"></div>
          <button class="btn-add-question" onclick="addQuestion('${el.id}')">+ Add question</button>
        </div>
        </div>`;
      }).join('');

      // Bind input listeners
      document.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', handleInput);
      });

      bindVisionInput();

      // Auto-resize textareas
      document.querySelectorAll('.option-description-input, .vision-input, .question-input').forEach(ta => {
        autoResize(ta);
        ta.addEventListener('input', () => autoResize(ta));
      });

      setupDragAndDrop();
    }

    // ── Drag and Drop ──

    let _dragType = null;
    let _dragId = null;
    let _dragElementId = null;

    function clearDragOverClasses() {
      document.querySelectorAll('[data-row], .option-row').forEach(el => {
        el.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    }

    function setupDragAndDrop() {
      // ── Element card drag handles ──
      document.querySelectorAll('[data-row]').forEach(row => {
        const card = row.querySelector('.element-card');
        const handle = card ? card.querySelector('.element-drag-handle') : null;
        if (!handle) return;

        handle.addEventListener('dragstart', e => {
          _dragType = 'element';
          _dragId = row.dataset.row;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', _dragId);
          e.dataTransfer.setDragImage(row, 16, 16);
          setTimeout(() => card.classList.add('dragging'), 0);
        });

        handle.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearDragOverClasses();
          _dragType = null;
          _dragId = null;
        });
      });

      document.querySelectorAll('[data-row]').forEach(row => {
        row.addEventListener('dragover', e => {
          if (_dragType !== 'element') return;
          if (row.dataset.row === _dragId) return;
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          clearDragOverClasses();
          if (e.clientY < rect.top + rect.height / 2) {
            row.classList.add('drag-over-top');
          } else {
            row.classList.add('drag-over-bottom');
          }
        });

        row.addEventListener('dragleave', e => {
          if (!row.contains(e.relatedTarget)) {
            row.classList.remove('drag-over-top', 'drag-over-bottom');
          }
        });

        row.addEventListener('drop', e => {
          e.preventDefault();
          if (_dragType !== 'element') return;
          const fromId = _dragId;
          const toId = row.dataset.row;
          if (fromId === toId) return;
          const fromIdx = state.elements.findIndex(el => el.id === fromId);
          const rect = row.getBoundingClientRect();
          const insertBefore = e.clientY < rect.top + rect.height / 2;
          const [moved] = state.elements.splice(fromIdx, 1);
          let toIdx = state.elements.findIndex(el => el.id === toId);
          if (!insertBefore) toIdx += 1;
          state.elements.splice(toIdx, 0, moved);
          saveState();
          render();
        });
      });

      // ── Option row drag handles ──
      document.querySelectorAll('.option-row').forEach(row => {
        const handle = row.querySelector('.option-drag-handle');
        if (!handle) return;

        handle.addEventListener('dragstart', e => {
          _dragType = 'option';
          _dragId = row.dataset.optionId;
          _dragElementId = row.dataset.elementId;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', _dragId);
          e.dataTransfer.setDragImage(row, 16, 10);
          e.stopPropagation();
          setTimeout(() => row.classList.add('dragging'), 0);
        });

        handle.addEventListener('dragend', () => {
          row.classList.remove('dragging');
          clearDragOverClasses();
          _dragType = null;
          _dragId = null;
          _dragElementId = null;
        });
      });

      document.querySelectorAll('.option-row').forEach(row => {
        row.addEventListener('dragover', e => {
          if (_dragType !== 'option') return;
          if (row.dataset.elementId !== _dragElementId) return;
          if (row.dataset.optionId === _dragId) return;
          e.preventDefault();
          e.stopPropagation();
          const rect = row.getBoundingClientRect();
          const card = document.querySelector(`[data-card="${_dragElementId}"]`);
          if (card) card.querySelectorAll('.option-row').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
          if (e.clientY < rect.top + rect.height / 2) {
            row.classList.add('drag-over-top');
          } else {
            row.classList.add('drag-over-bottom');
          }
        });

        row.addEventListener('dragleave', e => {
          if (!row.contains(e.relatedTarget)) {
            row.classList.remove('drag-over-top', 'drag-over-bottom');
          }
        });

        row.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          if (_dragType !== 'option') return;
          if (row.dataset.elementId !== _dragElementId) return;
          const fromId = _dragId;
          const toId = row.dataset.optionId;
          if (fromId === toId) return;
          const el = state.elements.find(el => el.id === _dragElementId);
          if (!el) return;
          const fromIdx = el.options.findIndex(o => o.id === fromId);
          const rect = row.getBoundingClientRect();
          const insertBefore = e.clientY < rect.top + rect.height / 2;
          const [moved] = el.options.splice(fromIdx, 1);
          let toIdx = el.options.findIndex(o => o.id === toId);
          if (!insertBefore) toIdx += 1;
          el.options.splice(toIdx, 0, moved);
          saveState();
          render();
        });
      });
    }

    loadState();
    render();

    // ── Tab switching ──

    let activeTab = 'elements';

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-elements').classList.toggle('active', tab === 'elements');
      document.getElementById('tab-roadmap').classList.toggle('active', tab === 'roadmap');
      document.getElementById('app').style.display = tab === 'elements' ? '' : 'none';
      document.getElementById('roadmap-panel').style.display = tab === 'roadmap' ? '' : 'none';
      const addBtn = document.querySelector('.btn-add-element');
      if (addBtn) addBtn.style.display = tab === 'elements' ? '' : 'none';
      if (tab === 'roadmap') renderRoadmap();
    }

    // ── Roadmap field setters ──

    function setPhase(elementId, phase) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      el.phase = (el.phase || '') === phase ? '' : phase;
      saveState();
      renderRoadmap();
    }

    function setEffort(elementId, effort) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      el.effort = el.effort === effort ? null : effort;
      saveState();
      renderRoadmap();
    }

    function setElementValue(elementId, value) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      el.value = el.value === value ? null : value;
      saveState();
      renderRoadmap();
    }

    function setScope(elementId, scope) {
      const el = state.elements.find(e => e.id === elementId);
      if (!el) return;
      el.scope = (el.scope || '') === scope ? '' : scope;
      saveState();
      renderRoadmap();
    }

    // ── Roadmap card HTML ──

    function roadmapCardHtml(el) {
      const scopeOpts = ['S', 'M', 'L', 'XL'];
      const phaseOpts = [['now', 'Now'], ['next', 'Next'], ['later', 'Later']];

      const scopeHtml = scopeOpts.map(s =>
        `<button class="seg-btn${(el.scope || '') === s ? ' active-scope' : ''}" onclick="setScope('${el.id}','${s}')">${s}</button>`
      ).join('');

      const effortHtml = [1,2,3,4,5].map(n =>
        `<button class="seg-btn${el.effort === n ? ' active-effort' : ''}" onclick="setEffort('${el.id}',${n})">${n}</button>`
      ).join('');

      const valueHtml = [1,2,3,4,5].map(n =>
        `<button class="seg-btn${el.value === n ? ' active-value' : ''}" onclick="setElementValue('${el.id}',${n})">${n}</button>`
      ).join('');

      const phaseHtml = phaseOpts.map(([p, label]) =>
        `<button class="seg-btn${(el.phase || '') === p ? ' active-' + p : ''}" onclick="setPhase('${el.id}','${p}')">${label}</button>`
      ).join('');

      return `<div class="roadmap-card">
          <div class="roadmap-card-title">${escHtml(el.title || 'Untitled element')}</div>
          <div class="roadmap-meta-row"><span class="roadmap-meta-label">Scope</span>${scopeHtml}</div>
          <div class="roadmap-meta-row"><span class="roadmap-meta-label">Effort</span>${effortHtml}</div>
          <div class="roadmap-meta-row"><span class="roadmap-meta-label">Value</span>${valueHtml}</div>
          <div class="roadmap-meta-row"><span class="roadmap-meta-label">Phase</span>${phaseHtml}</div>
        </div>`;
    }

    // ── Roadmap render ──

    function renderRoadmap() {
      const panel = document.getElementById('roadmap-panel');

      if (!state.elements.length) {
        panel.innerHTML = `<div class="empty-state"><div class="empty-icon">◈</div><h2>No elements yet</h2><p>Add elements in the Elements tab to start building your roadmap.</p></div>`;
        return;
      }

      // Priority Matrix (SVG)
      const W = 640, H = 380;
      const PL = 56, PT = 28, PR = 22, PB = 46;
      const CW = W - PL - PR, CH = H - PT - PB;
      const MX = PL + CW / 2, MY = PT + CH / 2;
      const ex  = e => PL + ((e - 1) / 4) * CW;
      const vy  = v => PT + (1 - (v - 1) / 4) * CH;
      const scopeR   = { S: 7, M: 10, L: 14, XL: 18, '': 9 };
      const phaseCol = { now: '#2d8a4e', next: '#1a5bbf', later: '#b85000', '': '#999999' };

      const matrixEls = state.elements.filter(el => el.effort != null && el.value != null);

      const circlesHtml = matrixEls.map(el => {
        const cx = ex(el.effort), cy = vy(el.value);
        const r = scopeR[el.scope || ''];
        const col = phaseCol[el.phase || ''];
        const lbl = escHtml((el.title || 'Untitled').slice(0, 18));
        const labelY = cy - r - 5;
        const textY = labelY < PT + 10 ? cy + r + 12 : labelY;
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" fill-opacity="0.82" stroke="${col}" stroke-width="1.5"><title>${escHtml(el.title || 'Untitled')} — Effort: ${el.effort}, Value: ${el.value}</title></circle>`
          + `<text x="${cx}" y="${textY}" text-anchor="middle" font-size="9.5" fill="#555" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${lbl}</text>`;
      }).join('');

      const svgHtml = `<svg class="matrix-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <rect x="${PL}" y="${PT}" width="${CW/2}" height="${CH/2}" fill="#eef8f2"/>
  <rect x="${MX}" y="${PT}" width="${CW/2}" height="${CH/2}" fill="#eff3ff"/>
  <rect x="${PL}" y="${MY}" width="${CW/2}" height="${CH/2}" fill="#f7f7f7"/>
  <rect x="${MX}" y="${MY}" width="${CW/2}" height="${CH/2}" fill="#fff7f0"/>
  <text x="${PL+CW/4}"   y="${PT+16}" text-anchor="middle" font-size="9.5" fill="#2d8a4e" font-weight="700" font-family="-apple-system,sans-serif" letter-spacing="0.5">QUICK WINS</text>
  <text x="${PL+3*CW/4}" y="${PT+16}" text-anchor="middle" font-size="9.5" fill="#1a5bbf" font-weight="700" font-family="-apple-system,sans-serif" letter-spacing="0.5">STRATEGIC</text>
  <text x="${PL+CW/4}"   y="${PT+CH-8}" text-anchor="middle" font-size="9.5" fill="#aaa"    font-weight="700" font-family="-apple-system,sans-serif" letter-spacing="0.5">LOW PRIORITY</text>
  <text x="${PL+3*CW/4}" y="${PT+CH-8}" text-anchor="middle" font-size="9.5" fill="#b85000" font-weight="700" font-family="-apple-system,sans-serif" letter-spacing="0.5">RECONSIDER</text>
  <rect x="${PL}" y="${PT}" width="${CW}" height="${CH}" fill="none" stroke="#ddd" stroke-width="1"/>
  <line x1="${MX}" y1="${PT}" x2="${MX}" y2="${PT+CH}" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="${PL}" y1="${MY}" x2="${PL+CW}" y2="${MY}" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="${PL+CW/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#888" font-family="-apple-system,sans-serif">Effort →</text>
  <text x="${PL+4}"    y="${H-10}" text-anchor="start"  font-size="9.5" fill="#bbb" font-family="-apple-system,sans-serif">Low</text>
  <text x="${PL+CW-4}" y="${H-10}" text-anchor="end"    font-size="9.5" fill="#bbb" font-family="-apple-system,sans-serif">High</text>
  <text x="13" y="${PT+CH/2}" text-anchor="middle" font-size="11" fill="#888" font-family="-apple-system,sans-serif" transform="rotate(-90,13,${PT+CH/2})">Value</text>
  <text x="${PL-6}" y="${PT+10}" text-anchor="end" font-size="9.5" fill="#bbb" font-family="-apple-system,sans-serif">High</text>
  <text x="${PL-6}" y="${PT+CH}" text-anchor="end" font-size="9.5" fill="#bbb" font-family="-apple-system,sans-serif">Low</text>
  ${circlesHtml}
</svg>`;

      // Swimlane
      const phaseLabel = { now: 'Now', next: 'Next', later: 'Later', '': 'Unassigned' };
      const swimHtml = ['now', 'next', 'later', ''].map(phase => {
        const els = state.elements.filter(el => (el.phase || '') === phase);
        const cls = phase || 'unassigned';
        const body = els.length
          ? els.map(el => roadmapCardHtml(el)).join('')
          : `<div class="swimlane-empty">No items</div>`;
        return `<div class="swimlane-col"><div class="swimlane-header ${cls}">${phaseLabel[phase]}</div><div class="swimlane-body">${body}</div></div>`;
      }).join('');

      panel.innerHTML = `
        <div class="matrix-container">
          <div class="roadmap-section-label">Effort × Value Matrix</div>
          ${matrixEls.length
            ? svgHtml
            : `<div style="text-align:center;padding:50px 0 40px;color:var(--text-muted);font-size:13px;">Assign effort and value to items in the swimlane below to plot them here.</div>`
          }
          <div class="matrix-legend">
            <span class="legend-item"><span class="legend-dot now"></span>Now</span>
            <span class="legend-item"><span class="legend-dot next"></span>Next</span>
            <span class="legend-item"><span class="legend-dot later"></span>Later</span>
            <span class="legend-item"><span class="legend-dot unassigned"></span>Unassigned</span>
            <span style="margin-left:auto">Bubble size = Scope (S / M / L / XL)</span>
          </div>
        </div>
        <div class="roadmap-section-label">Roadmap Phases</div>
        <div class="swimlane">${swimHtml}</div>`;
    }
  </script>
</body>
</html>
